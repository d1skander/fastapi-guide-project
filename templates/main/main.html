<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
</head>
<body>
    <nav class="menu">

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
