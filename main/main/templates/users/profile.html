<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
</head>
<body>
    <div class="user">
        <ul>
            <li>{{id}}</li>
            <li>{{username}}</li>
        </ul>
    <div class="window">
        <dialog id="editWindow">
            
            <details id="detailsUsername">
                <summary>Изменить логин</summary>
                <form method=post action="{{ url_for('new_username') }}">
                    <dl>
                        {{ user_form.username }}
                    </dl>
                    <button type="submit">Изменить</button>
                </form>
            </details>

            <details id="detailsPassword">
                <summary>Изменить пароль</summary>
                <form method=post action="{{ url_for('new_password') }}">
                    <dl>
                        {{ password_form.password }}
                    </dl>
                    <button type="submit">Изменить</button>
                </form>
            </details>
            <button id="editCancel" type="reset">Отменить</button>

        </dialog>
    </div>
    <div class="buttons">
        <button id="editButton">Изменить профиль</button>
        <form method="post" action="{{ url_for('logout') }}">
        <button id="logout">Выйти</button>
        </form>
    </div>


    <script src="{{ url_for('static', path='js/profile.js') }}"></script>
</body>
</html>
