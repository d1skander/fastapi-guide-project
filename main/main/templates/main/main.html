{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="{% url 'main' %}">Главная</a></li>
            <li><a href="{% url 'info' %}">О нас</a></li>
        </ul>
    </nav>

    <dialog id="redirectDialog">
        <a href="{% url 'reg' %}">Регистрация</a>
        <a href="{% url 'auth' %}">Войти</a>
        <button id="editCancel" type="reset">Выйти</button>
    </dialog>

    <div class="auth">
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">{{ user.username }}</a>
    {% else %}
        <button id="authButton">Войти</button>
    {% endif %}
    </div>

    <script src="js/main.js"></script>
</body>
</html>
