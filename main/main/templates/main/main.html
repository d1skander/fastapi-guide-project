{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main/main.css' %}">
    <title>Главная страница</title>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="{% url 'main' %}">Главная</a></li>
            <li><a href="{% url 'info' %}">О нас</a></li>
        </ul>
    </nav>

    <dialog id="redirectDialog">
        <a href="{% url 'reg' %}">Регистрация</a>
        <a href="{% url 'auth' %}">Войти</a>
        <button id="editCancel" type="reset">Выйти</button>
    </dialog>

    <div class="auth">
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">{{ user.username }}</a>
    {% else %}
        <button type="button" id="authButton">Войти</button>
    {% endif %}
    </div>


    <div class="sight">
        <ul>
            {% for i in form %}
            <li>
                <div class="image-wrapper">
                    {% if i.image.url %}
                        <a href="{% url 'sight' i.id %}">
                            <img src="{{ i.image.url }}" alt="{{ i.name }}">
                        </a>
                    {% else %}
                        <a href="{% url 'sight' i.id %}">
                            <img src="/image/default.png" alt="{{ i.name }}">
                        </a>
                    {% endif %}
                    </div>
                <div class="title">{{ i.name }}</div>
            </li>
            {% endfor %}
        </ul>
    </div>


    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
